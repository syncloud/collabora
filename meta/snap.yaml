name: collabora
summary: Collabora Online DE
description: Collabora Online Development Edition
grade: stable

apps:

  server:
    command: bin/service.server.sh
    user: collabora
    daemon: simple
    restart-condition: always
    restart-delay: 10s
    start-timeout: 600s

  backend:
    command: bin/service.backend.sh
    user: collabora
    daemon: simple
    restart-condition: always
    restart-delay: 10s
    start-timeout: 600s

  nginx:
    command: bin/service.nginx.sh
    user: collabora
    daemon: simple
    restart-condition: always
    restart-delay: 10s
    start-timeout: 600s

  cli:
    command: bin/cli

  storage-change:
    command: bin/cli storage-change

  access-change:
    command: bin/cli access-change

  backup-pre-stop:
    command: bin/cli backup-pre-stop

  restore-pre-start:
    command: bin/cli restore-pre-start

  restore-post-start:
    command: bin/cli restore-post-start
