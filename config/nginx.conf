worker_processes 4;

error_log syslog:server=unix:/dev/log warn;
pid {{ .SnapData }}/nginx/nginx.pid;
daemon off;

events {
    worker_connections  1024;
}

http {
    access_log syslog:server=unix:/dev/log;

    include {{ .SnapApp }}/nginx/etc/nginx/mime.types;
    default_type application/octet-stream;

    client_max_body_size 500m;
    client_body_temp_path {{ .SnapData }}/nginx/client_body_temp;
    proxy_temp_path {{ .SnapData }}/nginx/proxy_temp;
    fastcgi_temp_path {{ .SnapData }}/nginx/fastcgi_temp;
    uwsgi_temp_path {{ .SnapData }}/nginx/uwsgi_temp;
    scgi_temp_path {{ .SnapData }}/nginx/scgi_temp;

    upstream backend {
        server unix:{{ .SnapData }}/run/backend.sock;
    }

    server {
        listen unix:/var/snap/collabora/common/web.socket;
        set_real_ip_from unix:;
        server_name localhost;
        absolute_redirect off;

        root {{ .SnapApp }}/web/dist;

        include {{ .SnapData }}/config/authelia-location.conf;

        location ^~ /browser/dist/admin {
            include {{ .SnapData }}/config/proxy.conf;
            include {{ .SnapData }}/config/authelia-authrequest.conf;
            proxy_set_header Authorization "{{ .AdminAuthorization }}";
            proxy_pass http://127.0.0.1:9980;
        }

        location ^~ /cool/adminws {
            include {{ .SnapData }}/config/proxy.conf;
            include {{ .SnapData }}/config/authelia-authrequest.conf;
            proxy_set_header Authorization "{{ .AdminAuthorization }}";
            proxy_pass http://127.0.0.1:9980;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_read_timeout 36000s;
        }

        location ^~ /browser {
            proxy_pass http://127.0.0.1:9980;
            proxy_set_header Host $http_host;
        }

        location ^~ /hosting/discovery {
            proxy_pass http://127.0.0.1:9980;
            proxy_set_header Host $http_host;
        }

        location ^~ /hosting/capabilities {
            proxy_pass http://127.0.0.1:9980;
            proxy_set_header Host $http_host;
        }

        location ~ ^/cool/(.*)/ws$ {
            proxy_pass http://127.0.0.1:9980;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $http_host;
            proxy_read_timeout 36000s;
        }

        location ~ ^/(c|l)ool {
            proxy_pass http://127.0.0.1:9980;
            proxy_set_header Host $http_host;
        }

        location ^~ /wopi/ {
            return 404;
        }

        location ^~ /api/ {
            include {{ .SnapData }}/config/proxy.conf;
            proxy_pass http://backend;
        }

        location ^~ /oidc/ {
            include {{ .SnapData }}/config/proxy.conf;
            proxy_pass http://backend;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
     }
}
